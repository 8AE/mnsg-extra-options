[manifest]

id = "mnsg_extra_options"
version = "1.0.0"
display_name = "Extra Options"
description = """
Adds optional gameplay challenges to Mystical Ninja Starring Goemon: Recompiled. \
Configure No Hit, 1 Life, Loose Ryo on hit, Hyper Enemies, and the experimental Enemy Multiplier from the mod menu."""
short_description = "Optional No Hit, 1 Life, Ryo loss, Hyper Enemies, and enemy multiplier challenges."
authors = ["Killzbro"]
game_id = "mnsg"
minimum_recomp_version = "0.1.0"
dependencies = []
native_libraries = []

[[manifest.config_options]]
id = "no_hit"
name = "No Hit"
description = "Any damage immediately drops the active player's health to zero."
type = "Enum"
options = ["Enabled", "Disabled"]
default = "Disabled"

[[manifest.config_options]]
id = "one_life"
name = "1 Life"
description = "Keep the player at one internal life so the next death is game over."
type = "Enum"
options = ["Enabled", "Disabled"]
default = "Disabled"

[[manifest.config_options]]
id = "loose_ryo_on_hit"
name = "Loose Ryo on hit"
description = "Lose 50 Ryo and show the game's floating -50 Ryo robbery effect whenever the player takes damage."
type = "Enum"
options = ["Enabled", "Disabled"]
default = "Disabled"

[[manifest.config_options]]
id = "hyper_enemies"
name = "Hyper Enemies"
description = "Give supported enemies, enemy obstacles, and bosses 4x movement and attack cadence while retaining their native physics and collision processing."
type = "Enum"
options = ["Enabled", "Disabled"]
default = "Disabled"

[[manifest.config_options]]
id = "enemy_multiplier"
name = "Enemy Multiplier"
description = "Experimental. Choose how many copies of each supported enemy spawn when a room loads; higher values may crash the game."
type = "Enum"
options = ["1x (Normal)", "2x", "3x"]
default = "1x (Normal)"

[inputs]

elf_path = "build/mod.elf"
mod_filename = "mnsg_extra_options"
func_reference_syms_file = "Goemon64RecompSyms/mnsg.us.syms.toml"
data_reference_syms_files = ["Goemon64RecompSyms/mnsg.us.datasyms.toml"]
additional_files = []
